---
layout: default
title: "Scottish Collects from The Scottish Psalter of 1595"
---
<section class="blog single">
	<div class="wrap">
		{% for collect in site.scottishcollects %}
		<article class="blog-post">
			<div class="blog-post__header">
				<h2 class="blog-post__title"><a href="{{ collect.url | relative_url }}">{{ collect.title }}</a></h2>
			</div>
			{% if post.featured_image %}
			<a href="{{ collect.url | relative_url }}" class="blog-post__image" style="background-image: url({{ collect.featured_image | relative_url }});"></a>
			{% endif %}
			<div class="blog-post__content">
                {{ collect.content }}
			</div>
		</article>
		{% endfor %}
	</div>
</section>
