exclude:
    - vendor

show_drafts: false
show_future: false

# Permalinks
permalink:        /:year/:month/:day/:title/

# Setup
title:            Ryan Wentzel
tagline:          "δοῦλος Ἰησοῦ Χριστοῦ"
description:      "The official website of Ryan Wentzel"
url:              http://ryanlwentzel.com
baseurl:
domain:           ryanlwentzel.com
timezone:         America/Los_Angeles
paginate:         5
paginate_path:  page/:num
feed_url:       "feed.xml"
assets_path:	  /public
cdn_url:          https://d1yo597syf8yny.cloudfront.net
home_page:        index.html
home_page_inc:    /
excerpt_separator: <!--more--> 

author:
  name:           'Ryan Wentzel'
  url:            https://twitter.com/ryanwentzel
  twitter:        "http://twitter.com/ryanwentzel"
  twitter_handle: "ryanwentzel"
  instagram:      "https://www.instagram.com/ryanwentzel/"
  instagram_handle: "ryanwentzel"


keywords: 		  "Ryan Wentzel, Christianity, gospel, church, Reformed Baptist, Escondido, Christian books"  

# collections

collections:
    articles:
      output: true
      permalink: /:collection/:title

# social


# navbar

pages_list: { "About": "/about/" }

plugins:
    - jekyll-sitemap
    - jekyll-redirect-from
    - github-pages, group: :jekyll_plugins

# Defaults

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      comments: true
      layout: "post"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "post"
