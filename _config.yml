site: Ryan Wentzel

url: https://ryanlwentzel.com
baseurl: 

future: false
timezone: America/Los_Angeles

collections_dir: collections

collections:
  articles:
    output: true
    permalink: /articles/:slug
  microposts:
    output: true
    permalink: /microposts/:year:month:day:hour:minute
  notes:
    output: true
    permalink: /notes/:slug
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /:year/:month/:day/:title
  projects:
    output: false
    permalink: /project/:slug
  prayers:
    output: true
    permalink: /prayers/:slug
  scottishcollects:
    output: true
    permalink: /scottish-collects/:slug
  sermons:
    output: true
    permalink: /sermons/:slug

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "articles"
    values:
      layout: "article"
  -
    scope:
      path: ""
      type: "microposts"
    values:
      layout: "micropost"
  -
    scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      category: "articles"
  -
    scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  -
    scope:
      path: ""
      type: "prayers"
    values:
      layout: "prayer"
      published: true
      header_image: "https://d1yo597syf8yny.cloudfront.net/images/featured/window-02.jpg"
  -
    scope:
      path: ""
      type: "scottishcollects"
    values:
      layout: "collect"
  -
    scope:
      path: ""
      type: "sermons"
    values:
      layout: "sermon"
      talk_type: "sermon"

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  
sass:
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - github-pages, group: :jekyll_plugins

paginate: 6
paginate_path: "page/:num"

exclude: ['Rakefile']
  