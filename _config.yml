name: ryanlwentzel.com
title: Ryan Wentzel
description: >- # this means to ignore newlines until "baseurl:"
  Ryan Wentzel is a pastor. His ministry ranges from preaching, teaching, and writing, to listening, being present, and walking with others through some of life's most difficult experiences.
subtitle:
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://ryanlwentzel.com" # the base hostname & protocol for your site, e.g. http://example.com
future: false
timezone: America/Los_Angeles
# google_analytics: G-71MQMP8TL9
author:
  name: Ryan Wentzel
  email: hi@ryanlwentzel.com

sass:
  load_paths:
    - _sass
  style: compressed

pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  title: ':title'
  limit: 0
  sort_field: 'date'
  sort_reverse: true

# Collections settings
collections_dir: collections
collections:
  art:
    output: true
    permalink: /art/:title
  commonplace:
    output: true
    permalink: /commonplace/:title
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /:year/:month/:day/:title
  articles:
    output: true
    permalink: /articles/:title
  bombadil:
    output: true
    permalink: /bombadil/:title
  feeds:
    output: true
    permalink: /feeds/:title
  newsletter:
    output: true
    permalink: /newsletter/:title
  playlists:
    output: true
    permalink: /playlists/:title
  prayers:
    output: true
    permalink: /prayers/:title
  liturgies:
    output: true
    permalink: /liturgies/:title
  legacy:
    output: true
    permalink: /:year/:month/:day/:title
  resources:
    output: true
    permalink: /resources/:title
  sermons:
    output: true
    permalink: /podcasts/sermons/:title

defaults:
  - scope:
      path: ""
      type: art
    values:
      layout: art
      feature: false
      syndicate: false
      masthead:
        display: false
  - scope:
      path: ""
      type: commonplace
    values:
      layout: commonplace
      feature: false
      syndicate: false
      img:
        url: https://d1yo597syf8yny.cloudfront.net/assets/img/content/dim-hou-bfFX9KZJvhQ-unsplash.jpg
      masthead:
        full_bleed: true
  - scope:
      path: ""
      type: feeds
    values:
      syndicate: false
      sitemap:
        exclude: true
  - scope:
      path: ""
      type: newsletter
    values:
      layout: resource
      masthead:
        full_bleed: true
      feature: false
      syndicate: false
  - scope:
      path: ""
      type: posts
    values:
      layout: resource
      permalink: /:year/:month/:day/:title
      category: journal
      img:
        display: true
        url: https://dummyimage.com/1920x1200/e1e4e8/fff.png 
      feature: false
      syndicate: true
      masthead:
        full_bleed: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
      permalink: /:name
      feature: false
    masthead:
      text_only: true
  - scope:
      path: ""
      type: articles
    values:
      layout: resource
      category: article
      img:
        display: true
        url: ""
      feature: true
      syndicate: true
      masthead:
        full_bleed: true
  - scope:
      path: ""
      type: bombadil
    values:
      layout: resource
      category: bombadil
      img:
        display: false
      feature: false
      syndicate: false
  - scope:
      path: ""
      type: playlists
    values:
      layout: resource
      category: playlist
      feature: false
      img:
        display: false
        url: https://source.unsplash.com/FZWivbri0Xk
      masthead:
        full_bleed: true
  - scope:
      path: ""
      type: "sermons"
    values:
      layout: podcast-episode
      feature: false
      syndicate: true
      img:
        display: true
      masthead:
        full_bleed: true
  - scope:
      path: ""
      type: prayers
    values:
      layout: resource
      feature: true
      syndicate: true
      img:
        display: true
      masthead:
        full_bleed: true
  - scope:
      path: ""
      type: liturgies
    values:
      layout: resource
      category: liturgy
      feature: false
      img:
        display: true
        url: https://source.unsplash.com/FZWivbri0Xk
      masthead:
        full_bleed: true
  - scope:
      path: ""
      type: legacy
    values:
      layout: resource
      feature: false
      syndicate: false
      sitemap:
        exclude: true
      masthead:
        full_bleed: false
        text_only: true
  - scope:
      path: ""
      type: resources
    values:
      layout: resource
      feature: false
      syndicate: true
      masthead:
        full_bleed: true

# Build settings
# theme: minima
plugins:
  - jekyll-redirect-from

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - node_modules/
  - script/
  - .aws/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
