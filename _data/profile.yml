name: Ryan Wentzel
email: hi@ryanlwentzel.com
bio: |
  Ryan serves as a pastor at [Grace Bible Church](https://grcbible.org). His ministry ranges from preaching, teaching, and writing, to listening, being present, and walking with others through some of life's most difficult experiences.
  
  He lives with his wife and children in Escondido, California.
