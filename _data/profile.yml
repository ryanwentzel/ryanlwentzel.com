bio: >-
  Ryan is a nobody who belongs — body and soul, in life and in death — 
  to his faithful Savior, Jesus Christ. He served as a lead pastor at a church 
  in Southern California for 8+ years. Before that, he worked as a software engineer 
  for a decade. Today, he lives with his family in Escondido, California.
bio_short: "I write for weary pilgrims learning to follow Jesus through the wilderness."
