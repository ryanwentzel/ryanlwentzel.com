bio: >-
  Ryan writes for weary pilgrims learning to follow Jesus through the wilderness. 
  He served as a lead pastor at a church in Southern California from 2016–2025. 
  Before that, he worked as a software engineer in the biotech space. 
  Today, he lives with his family in Escondido, California.
