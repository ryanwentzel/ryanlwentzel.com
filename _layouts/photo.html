---
layout: default
---
<div class="container my-5 px-4">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-7">
            <h1 class="d-none">{{ page.seo_title | default: page.title }}</h1>
            <div class="photo text-center">
            {% include photos/page-photo.html -%}
            </div>
            <div class="resource-body mt-3 pt-3">
                {{ content }}
            </div>
            <hr class="mx-auto mb-3 border-dark-subtle">
            <div class="resource-footer bg-light border rounded-2 mt-5 py-5 px-md-4">
                <div class="text-center pt-3">
                    <img class="profile-img img-fluid rounded-circle" src="{{ site.data.profile.img.medium }}" width="200" height="200">
                    <span class="d-block fw-bold fs-1 py-3">{{ site.data.profile.name }}</span>
                </div>
                <div class="author-bio px-3 px-md-4 fs-5">{{ site.data.profile.bio | markdownify }}</div>
            </div>
        </div>
    </div>
</div>
