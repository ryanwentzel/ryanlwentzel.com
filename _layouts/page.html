---
layout: default
---

{%- unless page.display_title == false -%}
<section class="intro">
	<div class="wrap">
		<h1>{{ page.title }}</h1>
		<p class="post-byline">{{ page.subtitle }}</p>
	</div>
</section>
{%- endunless -%}

<section class="single">
	<div class="wrap">
		{{ page.content }}
	</div>
</section>
