---
layout: default
---
<section class="intro">
	<div class="wrap">
		<h1>{{ page.title }}</h1>
        <p class="post-byline">{{ page.subtitle }}</p>
	</div>
</section>
<section class="single">
	<div class="wrap">
        <p class="sermon-meta">
            A {{ page.talk_type }} on {{ page.text }}. Preached {{ page.date_preached | date: '%B %d, %Y' }} at {{ page.venue }} in {{ page.location }}.
		</p>
		{{ page.content }}
	</div>
</section>
