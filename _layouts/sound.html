---
layout: default
---
<section class="intro">
	<div class="wrap">
		<h1>{{ page.title }}</h1>
		<p class="post-byline">{{ page.date | date: '%B %d, %Y' }}</p>
	</div>
</section>
<section class="single">
	<div class="wrap">
        {{ page.content }}
		<div class="embeddable-resource">
			<audio controls>
				<source src="{{- page.audio_src -}}" type="{{- page.audio_mime -}}">
				Your browser does not support the audio element.
			</audio>
		</div>
	</div>
</section>
