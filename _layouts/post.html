---
layout: default
---

<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <span class="post-date">{{ page.date | date: '%B %d, %Y' }}</span>
  {{ content }}
</article>

{% if site.disqus_short_name and page.disable_comments != true %}
<section id="comment" class="comments">
    <div id="disqus_thread" aria-live="polite"></div>
</section>
{% include disqus.html %}
{% endif %}
