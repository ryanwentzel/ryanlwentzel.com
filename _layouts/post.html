---
layout: default
---
<section class="intro">
	<div class="wrap">
		<h1>{{ page.title }}</h1>
		<p class="post-byline">{{ page.date | date: '%B %d, %Y' }}</p>
	</div>
</section>
<section class="single single-blog-post">
	<div class="wrap">
		{%- include featured-image-single.html entry=page -%}
		{{ page.content }}
		<div class="single-blog-post__subscribe">
			<hr />
			{%- include subscribe-form.html -%}
		</div>
	</div>
</section>
