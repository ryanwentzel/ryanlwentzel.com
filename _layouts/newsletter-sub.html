---
layout: default
---
<main id="start-of-content" class="min-vh-100 mb-8">
    <div class="container-xl mx-auto pt-5">
        <div class="row px-lg-5 justify-content-between flex-wrap mb-5">
            <div class="col-md-7">
                <h1 class="display-3 fw-bold mb-3">{{ page.title | smartify }}</h1>
                <div class="d-none d-md-block fs-4 mb-4">
                    {{ page.content }}
                </div>
                <div class="d-none d-md-block mb-4">
                    {% include newsletter-subscription-form.html %}
                </div>
            </div>
            <div class="col-md d-flex justify-content-end align-self-center">
                <img class="d-block rounded-2 img-fluid" src="{{ page.logo.url }}" alt="Logo for The Weary Pilgrim Newsletter">
            </div>
            <div class="col-12">
                <div class="d-block d-md-none fs-4 mt-3 mb-4">
                    {{ page.content }}
                </div>
                <div class="d-block d-md-none">
                    {% include newsletter-subscription-form.html %}
                </div>
            </div>
        </div>
        <div class="row px-3 px-lg-5">
            {% include newsletter/recent-issues.html %}
        </div>
    </div>
</main>
