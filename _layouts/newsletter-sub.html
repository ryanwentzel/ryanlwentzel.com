---
layout: default
---
<main id="start-of-content" class="min-vh-100 mb-8 resource-body">
    <div class="container-xl mx-auto pt-5">
        <div class="row px-lg-5 justify-content-between flex-wrap mb-5">
            <div class="col-12 mb-3 mb-lg-5 px-3 px-lg-0">
                <h1 class="d-flex col-12 col-lg-8 display-3 fw-bold">{{ page.title | smartify }}</h1>
            </div>
            <div class="d-flex justify-content-center align-self-start col-12 order-1 col-lg-6 order-lg-2 mb-5 mb-lg-0">
                <img class="d-block rounded-2 img-fluid mw-lg-75" src="{{ page.logo.url }}" alt="Logo for The Weary Pilgrim Newsletter">
            </div>
            <div class="col order-2 order-lg-1">
                {{ page.content }}
                <div class="d-block">
                    {% include newsletter-subscription-form.html %}
                </div>
            </div>
        </div>
        <div class="row px-3 px-lg-5">
            {% include newsletter/recent-issues.html %}
        </div>
    </div>
</main>
