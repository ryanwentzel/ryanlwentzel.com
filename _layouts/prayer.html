---
layout: default
---
<section class="intro">
	<div class="wrap">
		<h1>{{ page.title }}</h1>
		<p>{{ page.date | date: '%B %d, %Y' }}</p>
	</div>
</section>
<section class="single">
	<div class="wrap">
        <p class="prayer-summary"><i>{{ page.summary }}</i></p>
		<div class="prayer-content">
			{{ page.content }}
		</div>
	</div>
</section>
