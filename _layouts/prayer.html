---
layout: default
header_image: "https://d1yo597syf8yny.cloudfront.net/images/featured/window-02.jpg"
---
<section class="intro">
	<div class="wrap">
		<h1>{{ page.title }}</h1>
		<p>{{ page.date | date: '%B %d, %Y' }}</p>
	</div>
</section>
<section class="single">
	<div class="wrap">
		<div class="prayer-summary">
			<p>{{ page.summary }}</p>
			{% if page.notes %}<p>{{ page.notes }}</p>{% endif %}
			<hr class="cross">
		</div>
		<div class="prayer-content">
			{{ page.content }}
		</div>
	</div>
</section>
