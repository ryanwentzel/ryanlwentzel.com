---
layout: default
title: "Sermons"
permalink: /sermons
header_image: "https://d1yo597syf8yny.cloudfront.net/images/featured/empty-pews.jpg"
---
<section class="blog single">
	<div class="wrap wrap-collection entry-list">
		<header class="collection-header">
			<h1 class="collection-title">{{- page.title -}}</h1>
		</header>
		{% for item in site.sermons %}
		<article class="blog-post collection-item">
			<div class="blog-post__header">
                <h2 class="blog-post__title"><a href="{{ item.url | relative_url }}" title="Read the full article">{{ item.title }}</a></h2>
                <p class="blog-post__subtitle">{{- item.date | date: '%B %d, %Y' -}}</p>
			</div>
			<div class="blog-post__content">
                <p class="item-content-preview">{{ item.excerpt }}</p>
                <p>
                    <a class="button" title="Read the full article" href="{{ item.url | absolute_url }}">Read More</a>
                </p>
			</div>
		</article>
		{% endfor %}
	</div>
</section>
