<article class="blog-post">
    <div class="blog-post__header">
        <h2 class="blog-post__title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h2>
    </div>
    {%- if include.post.featured_image -%}
    {%- include featured-image.html item=include.post -%}
    {%- endif -%}
    <div class="blog-post__content">
        <p>{{ include.post.excerpt }}</p>
        <p><a class="more-permalink" href="{{ include.post.url | relative_url }}">Read more...</a></p>
    </div>
</article>
