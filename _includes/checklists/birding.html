{% assign checklist = site.data.checklists[page.activity.bird_checklist.name] %}
<h2>Birds Observed</h2>
<div class="py-3 px-4 border rounded">
    <table class="table table-striped">
        <thead>
            <tr>
                <th scope="col">Species</th>
                <th scope="col">Count</th>
            </tr>
        </thead>
        <tbody>
    {% for row in checklist %}
            <tr>
                <td><small>{{ row.Species | smartify }}</small></td>
                <td><small>{{ row.Count }}</small></td>
            </tr>
    {% endfor %}        
        </tbody>
    </table>
</div>
