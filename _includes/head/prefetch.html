<link rel="preconnect" href="{{ site.data.cdn.base_url }}">
    <link rel="preconnect" href="{{ site.data.cdn.base_url }}" crossorigin>
    <link rel="preload" href="{{ site.data.cdn.base_url }}/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ site.data.cdn.base_url }}/assets/fonts/InterVariable-Italic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ site.data.cdn.url }}/assets/fonts/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{{ site.data.cdn.url }}/assets/fonts/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css"></noscript>
    {%- if page.img.url_lg %}
    <link rel="preload" as="image" fetchpriority="high" imagesrcset="{{ page.img.url_sm }} 854w, {{ page.img.url_md }} 1280w, {{ page.img.url_lg }} 2560w" href="{{ page.img.url_lg }}">
    {%- elsif page.img %}
    <link rel="preload" as="image" fetchpriority="high" href="{{ page.img.url }}"> 
    {%- endif %}
