<section class="homepage-section">
    <div class="d-flex section-heading">
        <h2 class="h4 fw-bold col-6">Newsletter</h2>
        <a class="col-6 ms-auto text-end text-reset text-decoration-none fw-normal" href="{{ site.data.archive.newsletter_archive | relative_url }}">
            View all
            <i class="bi bi-arrow-right"></i>
        </a>
    </div>
    {% assign issues = site.newsletter | reverse | where_exp: "item", "item.date <= site.time" -%}
    {% include layout-4x.html resources=issues -%}
</section>
