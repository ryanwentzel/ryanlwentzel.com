<div class="latest-section">
    <h1 class="latest-section__header">Latest Prayers</h1>
    {%- assign sorted = site.prayers | sort: "date" | reverse -%}
    {%- for item in sorted limit: 5 -%}
    <article class="blog-post">
        <div class="blog-post__header">
            <h2 class="blog-post__title"><a href="{{ item.url | relative_url }}">{{- item.title -}}</a></h2>
            <p class="blog-post__subtitle">{{- item.date | date: '%B %d, %Y' -}}</p>
        </div>
        {%- include featured-image.html item=item -%}
        <div class="blog-post__content .prayer-excerpt">
            {%- include prayer-content.html prayer=item -%}
        </div>
    </article>
    {%- endfor -%}
</div>
