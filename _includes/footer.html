<footer id="site-footer" class="mt-5 text-lg-start text-muted pt-5 overflow-hidden">
  <div id="footer-inner" class="container-fluid d-flex flex-column h-100 bg-light py-3 border-top">
    <div class="row flex-grow-1 align-items-end text-end px-3">
      <div class="col-12">
        <div class="follow-icons fs-5">
          <a class="icon-link px-1 text-reset" href="{{ site.data.nav.newsletter | relative_url }}" title="Subscribe to my newsletter">
            <i class="bi bi-newspaper"></i>
          </a>
          <a class="icon-link px-1 text-reset" href="{{ site.data.feeds.main | relative_url }}" title="Subscribe to the Atom feed to get all the latest content">
            <i class="bi bi-rss"></i>
          </a>
          <a class="icon-link px-1 text-reset" href="{{ site.data.nav.sermons | relative_url }}" title="{{ site.data.podcast.name }}">
            <i class="bi bi-broadcast-pin"></i>
          </a>
          <a class="icon-link px-1 text-reset" href="mailto:{{ site.author.email | encode_email }}" title="Contact Me">
            <i class="bi bi-envelope-at"></i>
          </a>
        </div>
        <div>
          <small>© {{ "now" | date: "%Y" }}. All Rights Reserved</small>
        </div>
        <div>
          <small>When you buy through my links, I may earn a commission.<br><a href="{% link _pages/disclosure-policy.md %}">Learn more</a></small>
        </div>
      </div>
    </div>
  </div>
</footer>
