<script defer src="{{ '/assets/js/vendors/cookieconsent/cookieconsent.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/cookieconsent-init.js' | relative_url }}"></script>
{% if jekyll.environment == 'production' and site.google_analytics %}
<script async type="text/plain" data-cookiecategory="analytics" src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script type="text/plain" data-cookiecategory="analytics">
    window['ga-disable-{{ site.google_analytics }}'] = window.doNotTrack === "1" || navigator.doNotTrack === "1" || navigator.doNotTrack === "yes" || navigator.msDoNotTrack === "1";
    window.dataLayer = window.dataLayer || [];
    function gtag(){window.dataLayer.push(arguments);}
    gtag('js', new Date());
  
    gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}
