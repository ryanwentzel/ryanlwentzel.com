<figure class="figure">
    <img class="figure-img img-fluid shadow-photo rounded" src="{{ page.img.url }}" alt="{{ page.img.alt }}" title="{{ page.img.title }}"/>
    <figcaption class="figure-caption pt-5 px-md-5">
        <span class="fst-italic fw-bold">{{ page.img.caption }}</span><br>
        <span>{{ page.img.date | date: "%B %d, %Y" }}</span><br>
        <span>{{ page.img.location }}</span>
    </figcaption>
</figure>
