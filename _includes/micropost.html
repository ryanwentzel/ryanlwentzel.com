<article class="blog-post micropost">
    <div class="blog-post__header">
		<p class="post-byline" title="Posted on {{ page.date | date: '%B %d, %Y %H:%M' }}">{{- include.entry.date | date: '%B %d, %Y %H:%M' -}}</p>
    </div>
    <div class="blog-post__content">
        <p>{{ include.entry.content }}</p>
    </div>
</article>
