<header class="masthead collection-masthead h-auto mb-5 rw-bg-contrast border-bottom">
    <div class="container-xl h-auto">
        <div class="row flex-wrap justify-content-between align-items-center px-2 py-5">
            <div class="col-12">
                <div class="d-block d-md-none">
                    <img class="img-fluid rounded-2 shadow" src="{{ page.img.url_sm }}" alt="{{ page.img.alt }}">
                    {%- if page.img.caption -%}
                    <small class="text-end">{{ page.img.caption | markdownify }}</small>
                    {% endif %}
                </div>
            </div>
            <div class="col-md-6 px-md-4 px-3 py-3 justify-content-end align-self-center">
                <h1 class="fs-6 fw-bold text-secondary text-capitalize">{{ page.title | smartify }}</h1>
                <p class="display-6">{{ page.description | smartify }}</p>
            </div>
            <div class="col-md-6 d-flex justify-content-start align-self-center py-3">
                <div class="d-none d-md-block">
                    <img class="img-fluid rounded-2 shadow" src="{{ page.img.url_sm }}" alt="{{ page.img.alt }}">
                    {%- if page.img.caption -%}
                    <small class="text-end">{{ page.img.caption | markdownify }}</small>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</header>
