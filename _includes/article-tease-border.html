{% assign resource = include.resource %}
<article class="py-4 d-flex flex-column tease-border">
    {% if resource.img.url != empty %}
    <a class="d-block col-12 position-relative rounded-2 mb-4 overflow-hidden" href="{{ resource.url | relative_url }}">
        <img class="d-block w-100 height-auto rounded-2" src="{{ resource.img.url }}">
    </a>
    {% endif %}
    <div class="col-12">
        <h3 class="h4 fw-black mb-2">
            <a class="resource-link text-reset" href="{{ resource.url | relative_url }}">{{ resource.title | smartify }}</a>
        </h3>
        <div class="resource-text rw-color-fg-muted">
            {{ resource.description | default: excerpt | markdownify }}
        </div>
        <div class="mt-3">
            <div class="d-flex align-items-center">
                <a class="d-inline-block fw-bold text-reset text-decoration-none" href="{{ resource.url | relative_url }}">
                    {{ include.link_text | default: "Read" }}
                    <i class="bi bi-arrow-right-circle"></i>
                </a>
            </div>
        </div>
    </div>
</article>
