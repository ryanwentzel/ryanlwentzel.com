{% assign resource = include.resource %}
<div class="d-flex flex-wrap">
    <div class="col-12 resource-col">
        <article class="highlighted-resource py-4 d-flex flex-column border-bottom">
            <a class="d-block col-12 rounded-2 overflow-hidden mb-4" href="{{ resource.url | relative_url }}">
                <img class="d-block w-100 h-auto rounded-2" src="{{ resource.img.med | default: resource.img.url }}" loading="lazy">
            </a>
            <div class="col-xs-12">
                <h3 class="display-5 tracking-tight fw-bold">
                    <a class="resource-link text-reset" href="{{ resource.url | relative_url }}">{{ resource.title | smartify }}</a>
                </h3>
                <div class="resource-text">
                    {{ resource.description | default: resource.excerpt | markdownify }}
                </div>
                <div class="mt-3">
                    <div class="d-flex align-items-center">
                        <a class="d-inline-block fw-bold text-reset text-decoration-none" href="{{ resource.url | relative_url }}">
                            Listen
                            <i class="bi bi-arrow-right-circle"></i>
                        </a>
                    </div>
                </div>
            </div>
        </article>
    </div>
</div>
