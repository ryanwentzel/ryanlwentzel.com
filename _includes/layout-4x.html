{% assign resources = include.resources -%}
{% assign limit = include.limit | default: 3 -%}
<div class="d-flex flex-wrap gutter-spacious">
    {% for resource in resources limit:limit -%}
    <article class="d-flex flex-column col-md-4 tease-border-alt--md">
        <div class="py-4 tease-border-alt-inner">
            <a class="d-block col-12 position-relative rounded-2 mb-3 overflow-hidden" href="{{ resource.url | relative_url }}"
            title="{{ resource.title }}">
                <img class="d-block w-100 height-auto rounded-2" src="{{ resource.img.url_sm }}"
                alt="{{ resource.img.alt }}">
            </a>
            <h3 class="h4 fw-black tracking-tight mb-0">
                <a class="resource-link text-reset" href="{{ resource.url | relative_url }}">{{ resource.title | smartify }}</a>
            </h3>
            <div class="rw-brand-text-muted mb-2">{{ resource.date | date: "%B %d, %Y" }}</div>
            <div class="resource-text">
                {{ resource.description | default: excerpt | markdownify }}
            </div>
            <div class="mt-3">
                <div class="d-flex align-items-center">
                    <a class="d-inline-block fw-bold text-reset text-decoration-none" href="{{ resource.url | relative_url }}">
                        Read
                        <i class="bi bi-arrow-right-circle"></i>
                    </a>
                </div>
            </div>
        </div>
    </article>
    {% endfor -%}
</div>
