<div class="resource-byline d-flex align-items-center py-2 mb-5 border-bottom">
    <div>
        <a href="{% link _pages/about.md %}">
            <img class="rounded-circle" src="{{ site.data.profile.img.small }}" height="50" width="50"
            alt="Ryan Wentzel's profile photo">
        </a>
    </div>
    <div class="px-2">
        <span class="resource-author">
            By <a class="resource-author fw-bold" href="{% link _pages/about.md %}" title="About {{ site.data.profile.name }}">{{ site.data.profile.name }}</a>
        </span>
        <div class="resource-pubdate rw-brand-text-muted">{{ page.date | date: '%B %d, %Y' }}</div>  
    </div>
</div>
