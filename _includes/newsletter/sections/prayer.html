{%- assign path = include.path -%}
{%- capture url -%}{%- link {{ path }} -%}{%- endcapture -%}
{%- assign prayer = site.prayers | find: "url", url -%}
{%- unless prayer == nil -%}
<img src="{{ prayer.img.url_md | default: prayer.img.url }}" alt="{{ prayer.img.alt }}">
<blockquote>
{{ prayer.content | markdownify }}
</blockquote>
{%- endunless -%}
